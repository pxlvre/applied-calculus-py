[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrange"
version = "0.1.0"
description = "Analyze and plot a real function of one real variable"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pol Vidal", email = "vidalplr@outlook.com" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "sympy>=1.12",
]

[project.optional-dependencies]
# Extras for working through the course material in Jupyter.
notebook = ["ipykernel", "jupyterlab", "pandas", "scipy"]
dev = ["ruff"]

[project.scripts]
lagrange = "lagrange.cli:main"

[project.urls]
Homepage = "https://github.com/pxlvre/lagrange"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
